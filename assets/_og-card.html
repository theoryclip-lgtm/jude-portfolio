<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Monsieur+La+Doulaise&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#1B1A17;color:#EDEBE4;
       font-family:Archivo,system-ui,sans-serif;padding:78px 84px;
       display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative}
  .ghost{position:absolute;right:-40px;bottom:-70px;font-size:230px;font-weight:900;
         letter-spacing:-.04em;color:rgba(237,235,228,.045);text-transform:uppercase;line-height:1}
  .top{display:flex;align-items:baseline;gap:26px;position:relative}
  .brand{font-family:'Monsieur La Doulaise',cursive;font-size:88px;line-height:.8}
  .rule{flex:1;height:1px;background:rgba(237,235,228,.2)}
  .loc{font-size:15px;letter-spacing:.3em;text-transform:uppercase;font-weight:600;color:#A5A199}
  h1{font-size:76px;font-weight:800;line-height:1.02;letter-spacing:-.025em;text-transform:uppercase;max-width:17ch;position:relative}
  h1 em{font-family:'Monsieur La Doulaise',cursive;font-style:normal;font-weight:400;
        text-transform:none;font-size:1.18em;color:#B79B6A;letter-spacing:0;padding:0 .06em}
  .bottom{display:flex;align-items:center;gap:22px;position:relative}
  .pill{font-size:17px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;
        background:#EDEBE4;color:#1B1A17;padding:15px 26px}
  .fine{font-size:17px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:#A5A199}
</style></head><body>
  <div class="ghost">Jude</div>
  <div class="top"><span class="brand">Jude</span><span class="rule"></span><span class="loc">Orange County, CA</span></div>
  <h1>Websites that turn <em>searches</em> into booked appointments.</h1>
  <div class="bottom"><span class="pill">(714) 510-6198</span><span class="fine">Free homepage mockup first</span></div>
</body></html>
